<header class="header" data-hero-base="header-home" data-hero-alt="Fondo página 1">
  <picture class="header__image">
        <!-- Desktop HD (pantallas grandes > 1600px) -->
        <source
        srcset="./assets/images/header/header-home-desktop-hd.jpg?as=avif&width=1920&dpr=2 2x, ./assets/images/header/header-home-desktop-hd.jpg?as=avif&width=1920&dpr=1 1x"
        type="image/avif" media="(min-width: 100em)" sizes="100vw">
      <source
        srcset="./assets/images/header/header-home-desktop-hd.jpg?as=webp&width=1920&dpr=2 2x, ./assets/images/header/header-home-desktop-hd.jpg?as=webp&width=1920&dpr=1 1x"
        type="image/webp" media="(min-width: 100em)" sizes="100vw">
  
  
      <!-- Desktop normal (pantallas entre 1200px - 1599px) -->
      <source
        srcset="./assets/images/header/header-home-desktop.jpg?as=avif&width=1200&dpr=2 2x, ./assets/images/header/header-home-desktop.jpg?as=avif&width=1200&dpr=1 1x"
        type="image/avif" media="(min-width: 75em)" sizes="100vw">
      <source
        srcset="./assets/images/header/header-home-desktop.jpg?as=webp&width=1200&dpr=2 2x, ./assets/images/header/header-home-desktop.jpg?as=webp&width=1200&dpr=1 1x"
        type="image/webp" media="(min-width: 75em)" sizes="100vw">
  
  
      <!-- Tablet (pantallas entre 768px - 1199px) -->
      <source
        srcset="./assets/images/header/header-home-tablet.jpg?as=avif&width=1024&dpr=2 2x, ./assets/images/header/header-home-tablet.jpg?as=avif&width=1024&dpr=1 1x"
        type="image/avif" media="(min-width: 48em)" sizes="10vw">
      <source
        srcset="./assets/images/header/header-home-tablet.jpg?as=webp&width=1024&dpr=2 2x, ./assets/images/header/header-home-tablet.jpg?as=webp&width=1024&dpr=1 1x"
        type="image/webp" media="(min-width: 48em)" sizes="10vw">
  
  
      <!-- Mobile (pantallas < 768px) -->
      <source
        srcset="./assets/images/header/header-home-mobile-vf.jpg?as=avif&width=464&dpr=2 2x, ./assets/images/header/header-home-mobile-vf.jpg?as=avif&width=464&dpr=1 1x"
        type="image/avif" media="(max-width: 47.99em)" sizes="100vw">
      <source
        srcset="./assets/images/header/header-home-mobile-vf.jpg?as=webp&width=464&dpr=2 2x, ./assets/images/header/header-home-mobile-vf.jpg?as=webp&width=464&dpr=1 1x"
        type="image/webp" media="(max-width: 47.99em)" sizes="100vw">
  
  
      <!-- Fallback JPG para navegadores antiguos -->
      <img src="./assets/images/header/header-home-mobile-vf.jpg" alt="Hands on earth"
        style="width: 100vw; display: block; margin: 0 auto;" sizes="100vw">
  </picture> <!-- requerido para que JS lo reemplace -->
  <include src="./views/navbar.html"></include>

  <div class="header__content">
    <h1 class="header__content-title">
      Juntos, hacia un <span>futuro redondo</span>
    </h1>
    <h2 class="header__content-subtitle">
      Primeras Jornadas de Economía Circular
    </h2>
    <div class="header__content-meta">
      <p class="header__content-meta--date">Septiembre 2025</p>
      <p class="header__content-meta--location">Centro Artesanal Torrearte</p>
      <p class="header__content-meta--province">Madrid</p>
    </div>
  </div>
</header>
